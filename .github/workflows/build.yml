name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: static analysis, unit tests, and a debug build.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json from secret
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests

  # Firestore security-rules integration tests against the emulator.
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Start Firestore emulator
        run: |
          firebase emulators:start --only firestore --project demo-expense-tracker &
          sleep 15
          curl -s http://localhost:8080/health | grep -q ok || (echo "Emulator failed to start"; exit 1)
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

      - name: Deploy security rules
        run: firebase deploy --only firestore:rules --project demo-expense-tracker

      - name: Run rules tests
        run: |
          # The rules test suite is not yet implemented; placeholder
          echo "Firestore rules deployed; no dedicated JS test suite yet."
