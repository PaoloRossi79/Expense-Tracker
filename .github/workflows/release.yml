name: Release

# Recommended trigger (requirements §10 #4): an explicit version tag.
# Also runs automatically on every commit to main (a new build) and can be
# triggered manually. To restrict to tag-only releases, remove the `branches`.
on:
  push:
    branches: [main]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew 

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json from secret
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Decode release keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Run tests (a tag can be pushed from any commit)
        run: ./gradlew ktlintCheck testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PATH: release.jks
          ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Non-secret identifiers (00-prerequisites.md §12) — inject as env so
          # CI builds (no local.properties) get them. Define as repo *variables*:
          # Settings -> Variables -> Actions -> New variable.
          ORG_GRADLE_PROJECT_WEB_CLIENT_ID: ${{ vars.WEB_CLIENT_ID }}
          ORG_GRADLE_PROJECT_HOUSEHOLD_ID: ${{ vars.HOUSEHOLD_ID }}

      - name: Upload release APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      # Option A from Design/04: Firebase App Distribution emails testers a
      # secure, expiring download link. No Play Store involvement.
      - name: Distribute via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUP }}
          file: app/build/outputs/apk/release/app-release.apk
